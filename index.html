<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="Count stock on your phone and send it to Acacia Books.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Count">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Acacia Stock Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="stocktake.css">
</head>
<body>
<noscript>Acacia Stock Count needs JavaScript turned on.</noscript>
<div id="app"><div class="boot"><img src="icon-192.png" alt="Acacia Books" width="112" height="112"><b>Acacia Stock Count</b><span>Loading...</span></div></div>
<div id="toast"></div>
<div id="scan"><video id="scanVid" playsinline muted></video><div class="bot"><b id="scanMsg">Point the camera at a barcode</b><button class="btn sec" id="scanClose" style="color:#fff;border-color:#444">Done scanning</button></div></div>

<script src="acacia-session.js"></script>
<script src="stocktake.js"></script>
</body>
</html>
